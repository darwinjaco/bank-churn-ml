name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.13'
          python-version: '3.11'
      - name: Export locked requirements
        run: |
          mkdir -p "${RUNNER_TEMP}/security"
          uv export --locked --all-groups --no-emit-project \
            --output-file "${RUNNER_TEMP}/security/requirements.txt" >/dev/null
      - name: Audit pinned dependencies without installing the project
        run: |
          uv tool run --python 3.11 --from pip-audit==2.10.1 pip-audit \
            --requirement "${RUNNER_TEMP}/security/requirements.txt" \
            --disable-pip --require-hashes --strict --progress-spinner off \
            --desc off --format json --output "${RUNNER_TEMP}/security/dependencies.json"
      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/security/dependencies.json
          retention-days: 7
          if-no-files-found: warn

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install verified Gitleaks binary
        run: |
          mkdir -p "${RUNNER_TEMP}/security"
          archive="${RUNNER_TEMP}/security/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "${archive}"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "${archive}" \
            | sha256sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/security" gitleaks
      - name: Scan history and minimize report
        run: |
          set +e
          "${RUNNER_TEMP}/security/gitleaks" git . --log-opts=--all \
            --redact=100 --no-banner --no-color --log-level error \
            --report-format json --report-path "${RUNNER_TEMP}/security/raw-secrets.json"
          scanner_exit=$?
          set -e
          python scripts/security_report.py "${RUNNER_TEMP}/security/raw-secrets.json" \
            "${RUNNER_TEMP}/security/secrets.json" --exit-code "${scanner_exit}"
      - name: Preserve metadata-only secret audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-audit
          path: ${{ runner.temp }}/security/secrets.json
          retention-days: 7
          if-no-files-found: warn
