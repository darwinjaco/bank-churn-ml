# Local: docker compose up --build  →  API en http://localhost:8000/docs, dashboard en http://localhost:8501
services:
  api:
    build: .
    image: bank-churn-ml:local
    environment:
      ROLE: api
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_CALLS_PER_HOUR: ${LLM_MAX_CALLS_PER_HOUR:-30}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    build: .
    image: bank-churn-ml:local
    environment:
      ROLE: dashboard
      API_URL: http://api:8000
      PORT: "8501"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
