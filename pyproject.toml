[project]
name = "churn"
version = "0.1.0"
description = "Bank customer churn prediction and profit-driven retention decisions."
readme = "README.md"
license = "MIT"
authors = [{ name = "Darwin Jacome Cuenca" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "pandera>=0.24",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "shap>=0.51",
    "statsmodels>=0.15.0",
    "streamlit>=1.65.0",
    "uvicorn>=0.30",
    "xgboost-cpu>=3.2",
]

[project.scripts]
churn-validate = "churn.validation:main"
churn-split = "churn.split:main"
churn-hypotheses = "churn.hypotheses:main"
churn-baselines = "churn.train:main"
churn-tune = "churn.tune:main"
churn-select = "churn.experiments:main"
churn-decide = "churn.decide:main"
churn-audit = "churn.run_audit:main"
churn-final = "churn.final_eval:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
eda = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "PD",       # pandas-vet
    "NPY",      # numpy
    "RUF",
]


[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "B018"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "realdata: requires data/raw/Churn_Modelling.csv (skipped if absent)",
]
